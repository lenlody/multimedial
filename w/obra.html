<!DOCTYPE html>
<html lang=" es">
<head>
<title>Mi sitio</title>
<style>
        /* Estilo general del cuerpo */
        body {
            font-family: Arial, sans-serif;
            background-color: #d6e6ff;
            margin: 0;
        }

        /* Contenedor principal */
        .contenedor {
            width: 40%;
            margin: auto;
        }

        /* Sección o bloque */
        .bloque {
            background-color: #f0f0f0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
        }

        /* Imagen */
        .bloque img {
            width: 40%;
            height: auto;
        }

        /* Encabezado */
        .bloque h2 {
            margin-top: 10px;
        }

        /* Texto */
        .bloque p {
            line-height: 1.5;
        }
    </style>
</head>

<body>
<!-- Contenedor principal -->
    <div class="contenedor">

        <!-- BLOQUE 1 -->
        <div class="bloque">
            <img src="img/aa1.jpg" alt="gatito miau">
            <h2>Sin título 1</h2>
            <p>
                Montaje de serigrafía.
            </p>
        </div>

        <!-- BLOQUE 2 -->
        <div class="bloque">
            <img src="img/aa3.jpg" alt="Descripción de la imagen">
            <h2>Título 2</h2>
            <p>
                Otro texto que acompaña la imagen. Puedes trabajar narrativa,
                análisis visual o cualquier tipo de contenido.
            </p>
        </div>

        <!-- BLOQUE 3 -->
        <div class="bloque">
            <img src="img/aa5.jpg" alt="Descripción de la imagen">
            <h2>Título 3</h2>
            <p>
                Este es un tercer bloque. Puedes repetir esta estructura
                tantas veces como quieras.
            </p>
        </div>

    </div>
<h1>Página 2</h1>

<a href="https://www.wikipedia.org" target="_blank">Ir a Wikipedia</a>
<a href="index.html">Volver al inicio</a>

</body>
</html>
